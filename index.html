<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Her Name (Today, Anyway)</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#140b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Genie's Name">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #140b1f;
    --void-deep: #0a0611;
    --smoke: #2a1b3d;
    --fuchsia: #c957e0;
    --gold: #e8b923;
    --teal: #3fddc4;
    --parchment: #ece3d8;
    --parchment-dim: #b8ab9c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--void);
    color: var(--parchment);
    font-family: 'Spectral', serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    position: relative;
  }

  .wisp {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
    animation: drift 22s ease-in-out infinite;
  }
  .wisp.a { width: 340px; height: 340px; background: var(--fuchsia); top: -80px; left: -60px; animation-duration: 26s; }
  .wisp.b { width: 260px; height: 260px; background: var(--teal); bottom: -60px; right: -40px; animation-duration: 19s; animation-delay: -6s; }
  .wisp.c { width: 200px; height: 200px; background: var(--gold); bottom: 20%; left: -80px; opacity: 0.18; animation-duration: 31s; animation-delay: -12s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.08); }
    66% { transform: translate(-20px, 25px) scale(0.95); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .eyebrow {
    font-style: italic;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--parchment-dim);
    margin-bottom: 6px;
  }

  .frame {
    position: relative;
    border: 1px solid rgba(201, 87, 224, 0.35);
    border-radius: 18px;
    padding: 36px 20px 28px;
    background: linear-gradient(180deg, rgba(42,27,61,0.55), rgba(20,11,31,0.75));
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 20px 60px rgba(0,0,0,0.5), inset 0 0 40px rgba(201,87,224,0.06);
  }

  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 10px; height: 10px;
    border: 1px solid var(--gold);
    opacity: 0.6;
  }
  .frame::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .frame::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .counter {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 18px;
  }
  .counter .num { color: var(--gold); font-weight: 600; }

  .name-stage {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    perspective: 600px;
  }

  .name {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    line-height: 1.15;
    background: linear-gradient(120deg, var(--fuchsia), var(--gold) 55%, var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(201,87,224,0.25);
    word-break: break-word;
  }

  .name.puff { animation: puffOut 0.42s ease forwards; }
  .name.arrive { animation: puffIn 0.42s ease forwards; }

  @keyframes puffOut {
    0% { opacity: 1; filter: blur(0px); transform: scale(1) rotateX(0deg); }
    100% { opacity: 0; filter: blur(10px); transform: scale(1.3) rotateX(40deg); }
  }
  @keyframes puffIn {
    0% { opacity: 0; filter: blur(10px); transform: scale(0.7) rotateX(-40deg); }
    100% { opacity: 1; filter: blur(0px); transform: scale(1) rotateX(0deg); }
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  button.summon {
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: var(--void-deep);
    background: linear-gradient(120deg, var(--gold), #f2d374);
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(232, 185, 35, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button.summon:active {
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(232, 185, 35, 0.3);
  }
  button.summon:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 3px;
  }

  button.reset {
    font-family: 'Spectral', serif;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--parchment-dim);
    background: transparent;
    border: 1px solid rgba(184, 171, 156, 0.35);
    border-radius: 999px;
    padding: 13px 18px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button.reset:hover { color: var(--parchment); border-color: var(--parchment-dim); }
  button.reset:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  .hint {
    margin-top: 16px;
    font-size: 0.78rem;
    color: var(--parchment-dim);
    font-style: italic;
  }

  @media (prefers-reduced-motion: reduce) {
    .wisp { animation: none; }
    .name.puff, .name.arrive { animation: none; }
  }
</style>
</head>
<body>

<div class="wisp a"></div>
<div class="wisp b"></div>
<div class="wisp c"></div>

<div class="card">
  <div class="eyebrow">say it, and it's already wrong</div>
  <div class="frame">
    <div class="counter">Name <span class="num" id="counterNum">1</span> of <span id="counterTotal">0</span></div>
    <div class="name-stage">
      <div class="name arrive" id="nameDisplay"></div>
    </div>
    <div class="controls">
      <button class="summon" id="summonBtn">Speak Her Name</button>
      <button class="reset" id="resetBtn" title="Start over from name 1">Reset</button>
    </div>
  </div>
  <div class="hint">tap the button — chaos handles the rest. your place is saved on this device.</div>
</div>

<script>
  const NAMES = ["Sprinkles", "Adanna", "Chidinma", "Deirdre", "Andiswa", "Jessica", "Alana", "Rebecca", "Vesna", "Wendy", "Miyu", "Marcia", "Shannon", "Juniper", "Wobblewick", "Nia", "Moana", "Alexis", "Soraya", "Fluster", "Nicole", "Aria", "Echo", "Yumi", "Aoife", "Marguerite", "Maeve", "Tenebrae", "Stella", "Cravenmoor", "Farah", "Elin", "Ying", "Sprocket", "Persimmon", "Gail", "Camila", "Zawadi", "Doris", "Emiko", "Nomvula", "Signe", "Xanthe", "Miriam", "Winnifred", "Xue", "Gwendolyn", "Aysun", "Zoe", "Betty", "Snickerdoodle", "Thalassindra", "Taylor", "Zhen", "Rosario", "Neema", "Fritz", "Calliope", "Charlotte", "Dalisay", "Ntombi", "Adina", "Ha-eun", "Linda", "Marilyn", "Zalika", "Thandiwe", "Victoria", "Jamila", "Dragana", "Kathleen", "Patricia", "Genevieve", "Jia", "Emma", "Debra", "Da-eun", "Dandelion", "Zanele", "Ivana", "Roberta", "Rin", "Doodle", "Stephanie", "Julie", "Oksana", "Marikit", "Elif", "Janet", "Imani", "Ondine", "Amanda", "Seraphina", "Cassandra", "Helena", "Judy", "Cordelia", "Joyce", "Marmalade", "Sakura", "Lauren", "Anahita", "Meera", "Rhiannon", "Sigrid", "Baraka", "Indira", "Ylva", "Rosalind", "Saffron", "Fatima", "Derya", "Aiko", "Wilhelmina", "Melody", "Mina", "Amina", "Asha", "Ricochet", "Nneka", "Megan", "Kiran", "Leilani", "Roxana", "Rania", "Saga", "Aziza", "Bronwyn", "Ishani", "Hana", "Daphne", "Thuy", "Obsidianne", "Yasmin", "Whisper", "Christina", "Ji-woo", "Nutmeg", "Nalani", "Thalia", "Amani", "Elektra", "Corvashae", "Nergis", "Samira", "Noelani", "Lakshmi", "Olivia", "Vesperine", "Genesis", "Naomi", "Katherine", "Zeynep", "Ursula", "Story", "Ananya", "Tansy", "Gulnara", "Shirin", "Marija", "Diane", "Journey", "Nour", "Cynthia", "Chandra", "Ziggurat", "Tumble", "Esperanza", "Na-yeon", "Priya", "Adaeze", "Seo-yeon", "Branwen", "Donna", "Flibbertigibbet", "Malia", "Wrenna", "Heather", "Ngozi", "Zuri", "Wraithmoon", "Valentina", "Brunhilde", "Melissa", "Runa", "Larisa", "Adelheid", "Kirsten", "Static", "Britta", "Celestine", "Clementine", "Blanche", "Liv", "Ronit", "Abigail", "Bramble", "Bumbleshoot", "Siobhan", "Anwen", "Alondra", "Yuki", "Destiny", "Kehau", "Keiko", "Liesel", "Ceren", "Hildegard", "Liora", "Zorana", "Iolanthe", "Isabella", "Nadia", "Kesi", "Christine", "Kayla", "Sablewing", "Buttercup", "Parisa", "Padma", "Riftwalker", "Wei", "Thora", "Colette", "Angela", "Hye-jin", "Widget", "Xiu", "Samantha", "Elizabeth", "Muddle", "Oyin", "Orla", "Michelle", "Sharon", "Solveig", "Yoon-ah", "Kavya", "Devika", "Hyacinth", "Simisola", "Ximena", "Rachel", "Talia", "Fable", "Amara", "Tabitha", "Yael", "Fiona", "Amelie", "Lan", "Furaha", "Renata", "Erin", "Zoya", "Ling", "Ayelet", "Bahar", "Layla", "Nancy", "Freya", "Larkspur", "Nokuthula", "Isolde", "Sarah", "Rosamund", "Pandora", "Anjali", "Shira", "Hollowmourn", "Ratana", "Josephine", "Ruth", "Karen", "Kerfuffle", "Gudrun", "Titilayo", "Hui", "Fang", "Grace", "Suchada", "Lien", "Carrie", "Dorothy", "Danielle", "Denise", "Lindiwe", "Ingrid", "Brenda", "Catalina", "Chaosbloom", "Soo-jin", "Saraswati", "Pickle", "Yelena", "Sevgi", "Bramblewit", "Jinxara", "Mai", "Diana", "Chiamaka", "Min-ji", "Busisiwe", "Lucia", "Mercedes", "Niamh", "Luna", "Chloe", "Ruckus", "Eun-ji", "Leila", "Threnody", "Clove", "Sophia", "Dalia", "Doomweave", "Katya", "Mayhem", "Frida", "Yetunde", "Gertrude", "Mirelith", "Katarina", "Ottoline", "Pilar", "Hannah", "Gigglesnort", "Nova", "Sayuri", "Fen", "Marigold", "Lian", "Delphine", "Efua", "Kanya", "Kiana", "Barbara", "Nyxandra", "Ora", "Peabody", "Poppy", "Athena", "Brittany", "Madison", "Lyric", "Enya", "Mei", "Soledad", "Odile", "Zahra", "Svetlana", "Courtney", "Yan", "Deborah", "Anastasia", "Abeni", "Ashley", "Noodle", "Consuelo", "Kaori", "Chiyo", "Sandra", "Qing", "Ravenshade", "Fatespinner", "Akira", "Celeste", "Lisa", "Ngoc", "Michiko", "Selenwyn", "Noa", "Vesper", "Emily", "Glitch", "Saoirse", "Folake", "Sparrow", "Divya", "Havocwind", "Kalani", "Ottilie", "Ualani", "Harmony", "Bogdana", "Jennifer", "Dolores", "Astrid", "Ginger", "Wren", "Cheryl", "Kimberly", "Amy", "Rani", "Blodwen", "Tara", "Milena", "Grimwhisper", "Persephone", "Susan", "Liwayway", "Pamela", "Trinket", "Fizzgig", "Pandemonia", "Aylin", "Laura", "Carol", "Beatrix"];

  const STORAGE_KEY = "chaosGenieNameIndex";

  const nameDisplay = document.getElementById('nameDisplay');
  const counterNum = document.getElementById('counterNum');
  const counterTotal = document.getElementById('counterTotal');
  const btn = document.getElementById('summonBtn');
  const resetBtn = document.getElementById('resetBtn');

  function loadIndex() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === null) return 0;
      const parsed = parseInt(saved, 10);
      if (Number.isNaN(parsed) || parsed < 0 || parsed >= NAMES.length) return 0;
      return parsed;
    } catch (e) {
      return 0;
    }
  }

  function saveIndex(i) {
    try {
      localStorage.setItem(STORAGE_KEY, String(i));
    } catch (e) {
      // localStorage unavailable (e.g. private browsing) - just keep going in memory
    }
  }

  let index = loadIndex();
  counterTotal.textContent = NAMES.length;

  function render(first) {
    nameDisplay.textContent = NAMES[index];
    counterNum.textContent = index + 1;
    if (!first) {
      nameDisplay.classList.remove('puff');
      void nameDisplay.offsetWidth; // restart animation
      nameDisplay.classList.add('arrive');
    }
  }

  render(true);

  btn.addEventListener('click', () => {
    nameDisplay.classList.remove('arrive');
    nameDisplay.classList.add('puff');
    setTimeout(() => {
      index = (index + 1) % NAMES.length;
      saveIndex(index);
      render(false);
    }, 420);
  });

  resetBtn.addEventListener('click', () => {
    index = 0;
    saveIndex(index);
    nameDisplay.classList.remove('arrive');
    nameDisplay.classList.add('puff');
    setTimeout(() => render(false), 420);
  });
</script>

</body>
</html>
